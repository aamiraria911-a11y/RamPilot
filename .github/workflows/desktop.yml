name: Desktop checks and builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - run: python -m pip install torch==2.6.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r tests/requirements.txt
      - run: python tests/prepare_fixture.py --tokenizers-only
      - run: xvfb-run -a python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python tests/native_numpy_smoke.py
  windows:
    needs: checks
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress
      - name: Compile app and assemble installer
        shell: pwsh
        run: ./build.ps1
      - name: Test native .NET desktop storage and downloader
        shell: pwsh
        run: |
          dotnet build tests/DesktopTests.csproj -c Release -o build/tests
          if ($LASTEXITCODE -ne 0) { throw 'Desktop test compilation failed' }
          & ./build/tests/DesktopTests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Desktop tests failed' }
      - name: Test packaged Windows CPU runtime and streaming inference
        shell: pwsh
        run: |
          & ./build/engine/python/python.exe tests/test_streaming.py
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows inference tests failed' }
      - name: Installer and installed-app smoke test
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/RamPilot-Setup-*.exe | Select-Object -First 1
          $installed = Join-Path $env:RUNNER_TEMP 'RamPilot-installed'
          $process = Start-Process $setup.FullName -ArgumentList @('/S', "/D=$installed") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          if (!(Test-Path "$installed/RamPilot.exe")) { throw 'Installed app is missing' }
          $app = Start-Process "$installed/RamPilot.exe" -ArgumentList @('--smoke', "$env:RUNNER_TEMP/RamPilot-smoke.png") -PassThru
          if (!$app.WaitForExit(60000)) { $app.Kill(); throw 'App startup timed out' }
          if ($app.ExitCode -ne 0 -or !(Test-Path "$env:RUNNER_TEMP/RamPilot-smoke.png")) { throw 'App UI smoke failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-installer
          path: dist/RamPilot-Setup-*.exe
          if-no-files-found: error
  mac:
    needs: checks
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify and assemble Intel Mac runtime
        run: |
          python mac/prepare_mac.py
          python mac/package_mac.py
      - name: Test packaged native runtime, Tk and CPU inference
        run: |
          APP_RES="$PWD/dist/RamPilot.app/Contents/Resources"
          export PYTHONNOUSERSITE=1
          export TCL_LIBRARY="$APP_RES/python/lib/tcl8.6"
          export TK_LIBRARY="$APP_RES/python/lib/tk8.6"
          "$APP_RES/python/bin/python3" -c 'import numpy, regex, ssl, tkinter; root=tkinter.Tk(); root.update(); root.destroy(); print("Native Tk and libraries OK")'
          "$APP_RES/python/bin/python3" tests/native_numpy_smoke.py "$APP_RES/app"
          "$APP_RES/python/bin/python3" tests/test_desktop_state.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Mac-Ventura-Intel
          path: dist/RamPilot-Mac-Ventura-Intel-*.zip
          if-no-files-found: error
  publish:
    if: github.event_name == 'release'
    needs: [windows, mac]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify tag, generate checksums and upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          cd release-assets
          sha256sum RamPilot-* > SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" ./* --repo "$GITHUB_REPOSITORY"
